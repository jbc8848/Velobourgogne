/* Modifications de la liste par l'utilisateur :
   GEARADD = éléments ajoutés (par catégorie) · GEARDEL = éléments d'origine masqués.
   Les éléments d'origine ne sont jamais effacés, seulement masqués : on peut
   toujours les restaurer. */
var GEARADD = {}, GEARDEL = {}, GEAREDIT = false;
try{ GEARADD = JSON.parse(localStorage.getItem('bourg-gear-add')||'{}') || {}; }catch(e){ GEARADD = {}; }
try{ GEARDEL = JSON.parse(localStorage.getItem('bourg-gear-del')||'{}') || {}; }catch(e){ GEARDEL = {}; }
function saveGear(){
  try{
    localStorage.setItem('bourg-gear-add', JSON.stringify(GEARADD));
    localStorage.setItem('bourg-gear-del', JSON.stringify(GEARDEL));
  }catch(e){}
}
/* liste effective d'une catégorie : [{key, text, custom}] */
function gearItems(ci){
  var out = [];
  GEAR[ci][1].forEach(function(t, ii){
    if(GEARDEL[ci+'-'+ii]) return;
    out.push({key:ci+'-'+ii, text:t, custom:false});
  });
  (GEARADD[ci]||[]).forEach(function(o){
    out.push({key:'c'+o.id, text:o.t, custom:true});
  });
  return out;
}
function gearCounts(){
  var d=0, t=0;
  GEAR.forEach(function(_, ci){
    gearItems(ci).forEach(function(it){
      t++;
      try{ if(localStorage.getItem('bourg-ck-'+it.key)==='1') d++; }catch(e){}
    });
  });
  return {done:d, total:t};
}
function gearHtml(){
  var c = gearCounts();
  var nDel = Object.keys(GEARDEL).length;
  var h = '<div class="card">'
    +'<p class="ckprog" id="ckprog">'+c.done+' / '+c.total+' cochés</p>'
    +'<div class="btn-row"><button class="gear-edit">'+(GEAREDIT?'\u2713 Terminer les modifications':'\u270f\ufe0f Modifier la liste')+'</button></div>';
  if(GEAREDIT && nDel>0){
    h += '<div class="btn-row"><button class="gear-restore">\u21ba Restaurer les '+nDel+' élément'+(nDel>1?'s':'')+' d\u2019origine supprimé'+(nDel>1?'s':'')+'</button></div>';
  }
  h += '</div>';
  GEAR.forEach(function(cat, ci){
    var items = gearItems(ci);
    h += '<div class="card"><h3>'+cat[0]+'</h3><div class="ckcat">';
    items.forEach(function(it){
      var on = false;
      try{ on = localStorage.getItem('bourg-ck-'+it.key)==='1'; }catch(e){}
      h += '<div class="ckline">'
        +'<label class="ck'+(on?' done':'')+'"><input type="checkbox" class="gck" data-ck="'+it.key+'"'+(on?' checked':'')+'>'
        +'<span>'+it.text+(it.custom?' <span class="cust">ajouté</span>':'')+'</span></label>'
        +(GEAREDIT?'<button class="gear-del" data-k="'+it.key+'" data-cat="'+ci+'" aria-label="Retirer cet élément">\u2715</button>':'')
        +'</div>';
    });
    h += '</div>';
    if(GEAREDIT){
      h += '<div class="addrow">'
        +'<input type="text" class="gear-in" data-cat="'+ci+'" placeholder="Ajouter un élément\u2026" maxlength="160">'
        +'<button class="gear-add" data-cat="'+ci+'">Ajouter</button></div>';
    }
    h += '</div>';
  });
  return h;
}
function renderGear(){
  var sec = document.getElementById('sec-materiel');
  if(sec){ sec.innerHTML = gearHtml(); }
}

/* ---------- partage ---------- */
function shareUrl(){
  var d = Object.keys(STATE.days).filter(function(k){ return STATE.days[k]; })
           .map(function(k){ return k.replace('d','')+'-'+STATE.days[k]; }).join(',');
  return location.origin+location.pathname+'#r='+STATE.rhythm+'&b='+(STATE.opts.bouclage?1:0)+'&d='+d;
}
function toggleShare(){
  var box = document.getElementById('sharebox');
  if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }
  var u = shareUrl();
  box.innerHTML = '<div style="margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px">'
    +'<p class="muted" style="font-size:.78rem;margin-bottom:8px">Ce lien rouvre l\u2019app avec exactement ce rythme et ces variantes.</p>'
    +'<div id="qr" style="display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px"></div>'
    +'<p style="font-family:\'Spline Sans Mono\',monospace;font-size:.66rem;word-break:break-all;margin-top:10px;color:var(--muted)">'+esc(u)+'</p>'
    +'</div>';
  try{
    if(window.QRCode){ new QRCode(document.getElementById('qr'), {text:u, width:150, height:150}); }
  }catch(e){}
}

/* =========================================================
   6. NAVIGATION
   ========================================================= */
var TABS = [
  {id:'sejour', lab:'Séjour', sub:'Réglage'},
  {id:'etapes', lab:'Étapes', sub:TOTAL_DAYS+' jours'},
  {id:'pratique', lab:'Pratique', sub:'Infos'},
  {id:'materiel', lab:'Matériel', sub:'Checklist'}
];
function etapesHtml(){
  if(openStage){
    var st = RUN.stages.find(function(s){ return s.id===openStage; });
    if(st && st.type==='ride'){ return stageHtml(st); }
    openStage = null;
  }
  return '<div class="card"><h2><small>Toucher pour ouvrir</small>Les '+RUN.stages.length+' journées</h2>'
    +'<p class="muted" style="margin-top:8px;font-size:.83rem">Un seul itinéraire, découpé en 17 journées. Valider une journée ou changer sa longueur réorganise instantanément tout ce qui suit.</p>'
    + chainList() +'</div>';
}
function render(){
  Object.keys(maps).forEach(function(k){ try{ maps[k].remove(); }catch(e){} });
  maps = {};
  mainEl.innerHTML = '';
  tabsEl.innerHTML = '';
  TABS.forEach(function(t){
    var sec = document.createElement('section');
    sec.className = 'day'+(t.id===currentTab?' on':'');
    sec.id = 'sec-'+t.id;
    if(t.id==='sejour') sec.innerHTML = sejourHtml();
    else if(t.id==='etapes') sec.innerHTML = etapesHtml();
    else if(t.id==='pratique') sec.innerHTML = pratiqueHtml();
    else sec.innerHTML = gearHtml();
    mainEl.appendChild(sec);
    var b = document.createElement('button');
    b.setAttribute('data-tab', t.id);
    b.innerHTML = t.lab+'<span class="d">'+t.sub+'</span>';
    if(t.id===currentTab) b.className='on';
    b.addEventListener('click', function(){ showTab(t.id); });
    tabsEl.appendChild(b);
  });
  if(currentTab==='sejour'){ initOverviewMap(); }
  if(currentTab==='etapes' && openStage){
    var st = RUN.stages.find(function(s){ return s.id===openStage; });
    if(st) initStageMap(st);
  }
}
function showTab(id){
  currentTab = id;
  if(id!=='etapes'){ openStage = null; }
  render();
  window.scrollTo(0,0);
}
function recompute(){
  RUN = computeStages();
  openStage = null;
  render();
}

/* délégation d'événements */
mainEl.addEventListener('input', function(ev){
  var el = ev.target;
  if(el && el.id==='slider-rythme'){
    var v = document.getElementById('slider-rythme-val');
    if(v){ v.textContent = RHYTHMS[+el.value].name; }
  }
});
mainEl.addEventListener('change', function(ev){
  var el = ev.target;
  if(el && el.id==='slider-rythme'){
    STATE.rhythm = +el.value; saveState(); recompute(); return;
  }
  if(el && el.classList && el.classList.contains('laychk')){
    var lk = el.getAttribute('data-lay');
    toggleLayer(lk, el.checked);
    var lab = el.closest('label');
    if(lab){ lab.classList.toggle('on', el.checked); }
    return;
  }
  if(el && el.classList && el.classList.contains('ochk')){
    STATE.opts[el.getAttribute('data-o')] = el.checked;
    STATE.days = {};
    saveState(); recompute(); return;
  }
  if(el && el.classList && el.classList.contains('gck')){
    var k = 'bourg-ck-'+el.getAttribute('data-ck');
    try{ localStorage.setItem(k, el.checked?'1':'0'); }catch(e){}
    var lab = el.closest('label');
    if(lab){ lab.classList.toggle('done', el.checked); }
    var pr = document.getElementById('ckprog');
    if(pr){ var cc = gearCounts(); pr.textContent = cc.done+' / '+cc.total+' cochés'; }
    return;
  }
});
mainEl.addEventListener('click', function(ev){
  var t = ev.target;
  var li = t.closest ? t.closest('li[data-stage]') : null;
  if(li && li.getAttribute('data-stage')){
    openStage = li.getAttribute('data-stage');
    currentTab = 'etapes';
    render(); window.scrollTo(0,0);
    return;
  }
  if(t.closest && t.closest('.back-btn')){ openStage=null; render(); window.scrollTo(0,0); return; }
  var dc = t.closest ? t.closest('.dch') : null;
  if(dc && !dc.disabled){
    var dnum = dc.getAttribute('data-day'), val = parseInt(dc.getAttribute('data-c'),10);
    if(val===0){ delete STATE.days['d'+dnum]; } else { STATE.days['d'+dnum] = val; }
    saveState();
    RUN = computeStages();
    var keep = openStage;
    render();
    if(keep){
      var still = RUN.stages.find(function(x){ return x.id===keep && x.type==='ride'; });
      if(still){ openStage = keep; currentTab='etapes'; render(); }
    }
    return;
  }
  if(t.closest && t.closest('.reset-btn')){ resetDays(); recompute(); return; }
  if(t.closest && t.closest('.undone-btn')){ resetDone(); recompute(); return; }
  var db = t.closest ? t.closest('.dbtn') : null;
  if(db){
    var mm0 = maps.apercu;
    if(!mm0 || !mm0._loadDay) return;
    var dn = parseInt(db.getAttribute('data-day'),10);
    var stt = mm0._dayState[dn];
    if(stt==='load') return;                      /* déjà en cours */
    if(stt==='ok'){                               /* déjà chargé : on bascule l'affichage */
      mm0._showDay(dn, mm0._shown[dn]===false);   /* masqué -> affiché, et inversement */
      return;
    }
    mm0._loadDay(dn, false);
    return;
  }
  var dbr = t.closest ? t.closest('.dreload') : null;
  if(dbr){
    var mm2 = maps.apercu;
    if(!mm2) return;
    var dn2 = parseInt(dbr.getAttribute('data-day'),10);
    var rr2 = RUN.stages.filter(function(x){ return x.type==='ride' && x.day===dn2; })[0];
    if(rr2){
      var base = (rr2.from.n+'_'+rr2.to.n).replace(/[^A-Za-z0-9_]/g,'').slice(0,50);
      try{
        localStorage.removeItem('bourgday-eau-'+base);
        localStorage.removeItem('bourgday-velo-'+base);
      }catch(e){}
    }
    ['eau','velo'].forEach(function(k){
      var g = mm2._dayG && mm2._dayG[k+dn2];
      if(g){ g.clearLayers(); delete mm2._dayG[k+dn2]; }
    });
    mm2._dayState[dn2] = '';
    mm2._loadDay(dn2, false);
    return;
  }
  if(t.closest && t.closest('.dreload-all')){
    var rw = document.getElementById('dreload-row');
    if(rw){ rw.style.display = (rw.style.display==='none' ? 'block' : 'none'); }
    return;
  }
  if(t.closest && t.closest('.loadall-osm')){
    var mm1 = maps.apercu;
    if(mm1 && mm1._loadAllDays) mm1._loadAllDays();
    return;
  }
  if(t.closest && t.closest('.retry-osm')){
    try{
      var kill=[];
      for(var ri=0; ri<localStorage.length; ri++){
        var rk=localStorage.key(ri);
        if(rk && (rk.indexOf('bourgwaterall')===0 || rk.indexOf('bourgveloall')===0)) kill.push(rk);
      }
      kill.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    var mm = maps.apercu;
    if(mm){ mm._eauLoaded = false; mm._veloLoaded = false;
      if(mm._g){ if(mm._g.eau) mm._g.eau.clearLayers(); if(mm._g.velo) mm._g.velo.clearLayers(); }
      if(LAYERS.eau && mm._loadEau) mm._loadEau();
      if(LAYERS.velo && mm._loadVelo) setTimeout(function(){ mm._loadVelo(); }, 1500);
    }
    return;
  }
  var vb = t.closest ? t.closest('.valid-btn') : null;
  if(vb){ validateDay(vb.getAttribute('data-day'), vb.getAttribute('data-node')); return; }
  var vo = t.closest ? t.closest('.valid-other') : null;
  if(vo){
    var sel = document.querySelector('.done-sel[data-day="'+vo.getAttribute('data-day')+'"]');
    if(sel){ validateDay(vo.getAttribute('data-day'), sel.value); }
    return;
  }
  var ub = t.closest ? t.closest('.unvalid-btn') : null;
  if(ub){
    delete STATE.done['d'+ub.getAttribute('data-day')];
    saveState(); RUN = computeStages(); render(); window.scrollTo(0,0); return;
  }

  /* ----- édition de la liste de matériel ----- */
  if(t.closest && t.closest('.gear-edit')){ GEAREDIT = !GEAREDIT; renderGear(); return; }
  var gd = t.closest ? t.closest('.gear-del') : null;
  if(gd){
    var key = gd.getAttribute('data-k'), cat = gd.getAttribute('data-cat');
    if(key.charAt(0)==='c'){
      var id = key.slice(1);
      GEARADD[cat] = (GEARADD[cat]||[]).filter(function(o){ return String(o.id)!==id; });
      if(!GEARADD[cat].length){ delete GEARADD[cat]; }
    }else{
      GEARDEL[key] = 1;                      /* masqué, jamais effacé */
    }
    try{ localStorage.removeItem('bourg-ck-'+key); }catch(e){}
    saveGear(); renderGear(); return;
  }
  var ga = t.closest ? t.closest('.gear-add') : null;
  if(ga){ addGearItem(ga.getAttribute('data-cat')); return; }
  if(t.closest && t.closest('.gear-restore')){ GEARDEL = {}; saveGear(); renderGear(); return; }
  var g = t.closest ? t.closest('.gpx-btn') : null;
  if(g){ downloadGpx(g.getAttribute('data-stage')); return; }
  var gd = t.closest ? t.closest('.guidon-btn') : null;
  if(gd){ enterGuidon(gd.getAttribute('data-stage')); return; }
  if(t.closest && t.closest('.allgpx-btn')){ downloadAllGpx(); return; }
  if(t.closest && t.closest('.share-btn')){ toggleShare(); return; }
});

function validateDay(day, nodeIdx){
  if(nodeIdx===null || nodeIdx===undefined || nodeIdx==='') return;
  STATE.done['d'+day] = parseInt(nodeIdx, 10);
  delete STATE.days['d'+day];          /* le fait remplace le choix théorique */
  saveState();
  RUN = computeStages();
  openStage = null;
  currentTab = 'etapes';
  render();
  window.scrollTo(0,0);
}
function addGearItem(cat){
  var inp = document.querySelector('.gear-in[data-cat="'+cat+'"]');
  if(!inp) return;
  var v = (inp.value||'').trim();
  if(!v) { inp.focus(); return; }
  v = v.replace(/[<>]/g,'').slice(0,160);
  if(!GEARADD[cat]) GEARADD[cat] = [];
  GEARADD[cat].push({id: Date.now().toString(36)+Math.floor(Math.random()*1000), t: v});
  saveGear();
  inp.value = '';
  renderGear();
  var again = document.querySelector('.gear-in[data-cat="'+cat+'"]');
  if(again) again.focus();
}
mainEl.addEventListener('keydown', function(ev){
  if(ev.key==='Enter' && ev.target && ev.target.classList && ev.target.classList.contains('gear-in')){
    ev.preventDefault();
    addGearItem(ev.target.getAttribute('data-cat'));
  }
});

/* balayage vers la droite = retour */
(function(){
  var x0=null, y0=null;
  document.addEventListener('touchstart', function(e){
    if(e.touches.length!==1){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(x0===null || GUIDON.active) return;
    var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
    if(dx>80 && dy<60){
      if(openStage){ openStage=null; render(); window.scrollTo(0,0); }
      else if(currentTab!=='sejour'){ showTab('sejour'); }
    }
    x0=null;
  }, {passive:true});
})();

render();

/* thème clair / sombre */
(function(){
  var btn = document.getElementById('theme-toggle');
  function apply(th){
    if(th==='light'){ document.documentElement.setAttribute('data-theme','light'); }
    else{ document.documentElement.removeAttribute('data-theme'); }
    if(btn){ btn.textContent = th==='light' ? '\ud83c\udf19' : '\u2600\ufe0f'; }
    var mt = document.getElementById('meta-theme');
    if(mt){ mt.setAttribute('content', th==='light' ? '#f5f1e8' : '#08252e'); }
  }
  var cur = 'dark';
  try{ cur = localStorage.getItem('bourg-theme')||'dark'; }catch(e){}
  apply(cur);
  if(btn){
    btn.addEventListener('click', function(){
      cur = (cur==='light') ? 'dark' : 'light';
      try{ localStorage.setItem('bourg-theme', cur); }catch(e){}
      apply(cur);
    });
  }
})();

/* bandeau d'installation */
(function(){
  var deferred = null;
  function bar(html, label, onClick){
    if(document.querySelector('.install-bar')) return;
    var d = document.createElement('div');
    d.className = 'install-bar';
    d.innerHTML = '<span>'+html+'</span>'
      +(label ? '<button class="ib-go">'+label+'</button>' : '')
      +'<button class="ib-x" aria-label="Fermer">\u2715</button>';
    document.body.appendChild(d);
    var x = d.querySelector('.ib-x');
    x.addEventListener('click', function(){
      d.remove();
      try{ localStorage.setItem('bourg-install-hide','1'); }catch(e){}
    });
    var go = d.querySelector('.ib-go');
    if(go && onClick){ go.addEventListener('click', function(){ onClick(d); }); }
  }
  var hidden = false;
  try{ hidden = localStorage.getItem('bourg-install-hide')==='1'; }catch(e){}
  var standalone = false;
  try{ standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone; }catch(e){}
  if(hidden || standalone) return;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    bar('Installer l\u2019app sur l\u2019écran d\u2019accueil \u2014 elle fonctionne hors-ligne.', 'Installer', function(d){
      d.remove();
      deferred.prompt();
    });
  });
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if(iOS){
    setTimeout(function(){
      bar('Pour installer : bouton <b>Partager</b> puis <b>Sur l\u2019écran d\u2019accueil</b>.', '', null);
    }, 2500);
  }
})();

/* service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
