<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour de Bourgogne à vélo — 17 jours en famille</title>
<meta name="description" content="Itinérance vélo 14 jours en famille au départ de Saint-Jean-de-Losne — 14 au 27 août 2026">
<meta name="theme-color" content="#08252e" id="meta-theme">
<script>try{if(localStorage.getItem('bourg-theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

:root{
  --deep:#08252e; --deep2:#0c313d; --panel:#10394a; --line:#1c4a5c;
  --aqua:#6fd6c9; --gold:#f0b860; --ocre:#d98a4e; --sage:#9fc48f;
  --ink:#eaf4f2; --muted:#8fb3ad; --danger:#e58a7a;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Spline Sans',system-ui,sans-serif;
  background:var(--deep); color:var(--ink);
  min-height:100vh; padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{
  padding:26px 0 18px;
  background:linear-gradient(180deg,#0a2b36 0%,var(--deep) 100%);
  border-bottom:1px solid var(--line);
}
.eyebrow{
  font-family:'Spline Sans Mono',monospace; font-size:.72rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--aqua); margin-bottom:8px;
}
h1{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
  font-size:clamp(1.7rem,6vw,2.6rem); line-height:1.05; letter-spacing:-.01em;
}
h1 .gold{color:var(--gold)}
.subline{color:var(--muted); font-size:.95rem; margin-top:10px; line-height:1.5}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{
  font-family:'Spline Sans Mono',monospace; font-size:.72rem;
  border:1px solid var(--line); border-radius:999px; padding:5px 11px;
  color:var(--aqua); background:rgba(111,214,201,.06);
}

/* ---------- tabs ---------- */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:1000;
  background:rgba(8,37,46,.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex; justify-content:center; gap:4px; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1; max-width:200px; border:none; cursor:pointer;
  background:transparent; color:var(--muted);
  font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:.78rem;
  padding:10px 4px; border-radius:12px; transition:.2s;
}
nav.tabs button .d{display:block;font-family:'Spline Sans Mono',monospace;font-weight:400;font-size:.56rem;margin-top:2px;letter-spacing:.04em}
nav.tabs button.on{background:var(--panel); color:var(--gold)}

/* curseur de distance (accueil) */
.slider-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.slider-head .lbl{font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:.9rem}
.slider-head .val{font-family:'Spline Sans Mono',monospace; font-size:.95rem; color:var(--gold); font-weight:500}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px;
  background:linear-gradient(90deg,var(--aqua),var(--gold)); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--gold); border:3px solid var(--deep); cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-thumb{
  width:22px; height:22px; border-radius:50%;
  background:var(--gold); border:3px solid var(--deep); cursor:pointer;
}
.slider-ticks{display:flex; justify-content:space-between; margin-top:6px;
  font-family:'Spline Sans Mono',monospace; font-size:.62rem; color:var(--muted)}

/* paliers d'une journée */
.paliers{display:flex; gap:6px; margin:12px 0 0; flex-wrap:wrap}
.paliers button{
  border:1px solid var(--line); background:transparent; color:var(--muted);
  font-family:'Spline Sans Mono',monospace; font-size:.72rem;
  padding:7px 11px; border-radius:999px; cursor:pointer; transition:.2s;
}
.paliers button.on{border-color:var(--gold); color:var(--gold); background:rgba(240,184,96,.08)}

/* légende vue d'ensemble */
.slider-box{background:var(--panel); border-radius:12px; padding:14px 16px; margin-bottom:12px}
.slider-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.slider-head span{font-size:.85rem; color:var(--muted)}
.slider-head b{font-family:'Spline Sans Mono',monospace; font-size:1.15rem; color:var(--gold)}
.km-slider{
  width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
  background:linear-gradient(90deg,var(--aqua),var(--gold)); outline:none; cursor:pointer;
}
.km-slider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--gold); border:3px solid var(--deep); box-shadow:0 1px 5px rgba(0,0,0,.5);
}
.km-slider::-moz-range-thumb{
  width:22px; height:22px; border-radius:50%;
  background:var(--gold); border:3px solid var(--deep); box-shadow:0 1px 5px rgba(0,0,0,.5);
}
.km-slider:focus-visible{outline:2px solid var(--aqua); outline-offset:4px}
.slider-marks{display:flex; justify-content:space-between; margin-top:6px;
  font-family:'Spline Sans Mono',monospace; font-size:.62rem; color:var(--muted)}
.legend{display:grid; gap:8px; margin-top:12px}
.lrow[data-day]{cursor:pointer; transition:.15s}
.lrow[data-day]:active{transform:scale(.99); background:rgba(240,184,96,.10)}
.lrow .go{flex:none; margin-left:6px; color:var(--muted); font-size:1.3rem; line-height:1}
.lrow{display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center;
  background:var(--panel); border-radius:10px; padding:9px 12px}
.lrow .sw{width:22px; height:6px; border-radius:3px}
.lrow .nm{font-size:.85rem; font-weight:600}
.lrow .st{font-family:'Spline Sans Mono',monospace; font-size:.7rem; color:var(--muted); white-space:nowrap}

/* ---------- sections / cards ---------- */
section.day{display:none; padding-top:20px}
section.day.on{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{
  background:var(--deep2); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; margin-bottom:16px;
}
h2{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
  font-size:1.35rem; line-height:1.15;
}
h2 small{display:block;font-family:'Spline Sans Mono',monospace;font-weight:400;font-size:.72rem;color:var(--aqua);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
h3{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:1rem;
  color:var(--gold); margin-bottom:10px;
}
p{line-height:1.55; font-size:.93rem}
.muted{color:var(--muted)}

/* stats */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px}
.stat{
  background:var(--panel); border-radius:10px; padding:10px 6px; text-align:center;
}
.stat b{
  display:block; font-family:'Spline Sans Mono',monospace; font-weight:500;
  font-size:1.02rem; color:var(--ink);
}
.stat span{font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}

/* variant switcher */
.variants{display:flex; gap:6px; margin:14px 0 0}
.variants button{
  flex:1; border:1px solid var(--line); background:transparent; color:var(--muted);
  font-family:'Spline Sans',sans-serif; font-weight:600; font-size:.8rem;
  padding:9px 4px; border-radius:10px; cursor:pointer; transition:.2s;
}
.variants button.on{border-color:var(--aqua); color:var(--aqua); background:rgba(111,214,201,.08)}
.variant-desc{margin-top:12px; font-size:.88rem; line-height:1.5; color:var(--muted)}
.variant-desc b{color:var(--ink)}

/* map */
.map{height:340px; border-radius:var(--r); border:1px solid var(--line); overflow:hidden}
.leaflet-container{background:#0a2b36; font:inherit}
.vlab{
  background:rgba(8,37,46,.85)!important; border:1px solid var(--line)!important;
  color:var(--ink)!important; font-family:'Spline Sans Mono',monospace!important;
  font-size:.62rem!important; padding:2px 6px!important; border-radius:6px!important;
  box-shadow:none!important;
}
.vlab::before{display:none!important}
.locate-btn{font-size:15px; line-height:30px; text-align:center; text-decoration:none}
.locate-btn.on{background:#4a9df0!important; }
.loc-dot{
  width:16px; height:16px; border-radius:50%;
  background:#4a9df0; border:3px solid #fff;
  box-shadow:0 0 0 0 rgba(74,157,240,.55);
  animation:locpulse 2s infinite;
}
@keyframes locpulse{
  0%{box-shadow:0 0 0 0 rgba(74,157,240,.55)}
  70%{box-shadow:0 0 0 14px rgba(74,157,240,0)}
  100%{box-shadow:0 0 0 0 rgba(74,157,240,0)}
}
.gpx-btn{
  display:block; width:100%; margin-top:12px; padding:12px;
  border:1.5px solid var(--gold); border-radius:12px; background:transparent;
  color:var(--gold); font-family:'Bricolage Grotesque',sans-serif; font-weight:600;
  font-size:.9rem; cursor:pointer; transition:.2s;
}
.gpx-btn:active{background:rgba(240,184,96,.12); transform:scale(.99)}
.btn-row{display:flex; gap:8px; margin-top:12px}
.btn-row .gpx-btn, .btn-row .guidon-btn{margin-top:0; flex:1}
.guidon-btn{
  display:block; padding:12px; border:1.5px solid var(--aqua); border-radius:12px;
  background:transparent; color:var(--aqua);
  font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:.9rem; cursor:pointer; transition:.2s;
}
.guidon-btn:active{background:rgba(111,214,201,.12); transform:scale(.99)}
.guidon-fs{
  position:fixed!important; inset:0!important; z-index:3000!important;
  height:100vh!important; height:100dvh!important; width:100vw!important;
  border-radius:0!important; border:none!important;
}
body.noscroll{overflow:hidden}
.guidon-bar{
  position:absolute; z-index:1200; left:10px; right:10px; bottom:calc(12px + env(safe-area-inset-bottom));
  background:rgba(8,37,46,.92); border:1px solid var(--line); border-radius:14px;
  padding:12px 14px; display:flex; align-items:center; gap:10px;
}
.guidon-bar .gstep{flex:1; font-size:.92rem; line-height:1.35; color:#eaf4f2}
.guidon-bar .gexit{
  flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:rgba(255,255,255,.08); color:#eaf4f2; font-size:1rem; cursor:pointer;
}
[data-theme="light"] .guidon-bar{background:rgba(255,255,255,.94)}
[data-theme="light"] .guidon-bar .gstep{color:var(--ink)}
[data-theme="light"] .guidon-bar .gexit{background:rgba(0,0,0,.05); color:var(--ink)}
.off-toggle{
  display:flex; align-items:flex-start; gap:10px; margin-top:14px;
  background:var(--panel); border-radius:12px; padding:12px 14px; cursor:pointer;
  font-size:.88rem; line-height:1.45;
}
.off-toggle input{width:20px; height:20px; margin-top:1px; accent-color:var(--gold); flex:none; cursor:pointer}
.off-toggle i{color:var(--muted); font-style:normal; font-size:.8em}
.off-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.off-chip{
  display:inline-flex; align-items:center; gap:7px;
  font-family:'Spline Sans Mono',monospace; font-size:.68rem; color:var(--muted);
  border:1px solid var(--line); border-radius:999px; padding:5px 11px;
}
.off-chip .sw{width:16px; height:4px; border-radius:2px}
.qr-box{background:#fff; padding:14px; border-radius:14px; width:max-content; margin:14px auto 4px}
.tile-warn{
  position:absolute; z-index:800; left:10px; right:10px; bottom:10px;
  background:rgba(8,37,46,.9); border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; font-family:'Spline Sans Mono',monospace; font-size:.68rem;
  color:var(--muted); line-height:1.4;
}
.map-note{font-family:'Spline Sans Mono',monospace; font-size:.68rem; color:var(--muted); margin-top:8px; line-height:1.5}

/* profile */
.profile svg{width:100%; height:auto; display:block}

/* timeline */
.tl{list-style:none}
.tl li{
  display:grid; grid-template-columns:64px 1fr; gap:12px;
  padding:9px 0; border-bottom:1px dashed var(--line);
}
.tl li:last-child{border-bottom:none}
.tl .h{
  font-family:'Spline Sans Mono',monospace; font-size:.8rem; color:var(--aqua);
  padding-top:1px; white-space:nowrap;
}
.tl .t{font-size:.9rem; line-height:1.45}
.tl .t b{color:var(--gold); font-weight:600}
.tl li.pic .h{color:var(--gold)}

/* météo */
.meteo{display:grid; gap:10px}
.mrow{
  display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:start;
  background:var(--panel); border-radius:10px; padding:11px 12px;
}
.mrow .ico{font-size:1.3rem; line-height:1.2}
.mrow .txt{font-size:.87rem; line-height:1.5}
.mrow .txt b{color:var(--aqua)}

/* pratique */
ul.plain{list-style:none}
ul.plain li{
  padding:8px 0 8px 22px; position:relative; font-size:.9rem; line-height:1.5;
  border-bottom:1px dashed var(--line);
}
ul.plain li:last-child{border:none}
ul.plain li::before{content:"◆"; position:absolute; left:2px; color:var(--gold); font-size:.6rem; top:12px}
.warn{border-left:3px solid var(--danger); background:rgba(229,138,122,.07); border-radius:0 10px 10px 0; padding:11px 13px; font-size:.87rem; line-height:1.5; margin-top:12px}
.warn b{color:var(--danger)}

footer{
  text-align:center; padding:30px 16px 10px;
  font-family:'Spline Sans Mono',monospace; font-size:.68rem; color:var(--muted);
}
@media (max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .map{height:290px}
}
/* ---------- ligne version + thème ---------- */
/* popup ouvert : les contrôles s'effacent (ils reviennent à la fermeture) */
.leaflet-container.popup-open .leaflet-top.leaflet-left{opacity:0; pointer-events:none; transition:opacity .15s}
.leaflet-container .leaflet-top.leaflet-left{transition:opacity .15s}
.leaflet-popup-content{font-size:.95rem; line-height:1.45}

/* POI en menus déroulants dans le déroulé */
.tl-poi{
  display:block; margin-top:8px; border:1px solid var(--line); border-left:3.5px solid var(--gold);
  border-radius:10px; background:var(--panel); overflow:hidden;
}
.tl-poi.walk{border-left-color:#e0492e}
.tl-poi summary{
  padding:9px 12px; cursor:pointer; font-size:.86rem; font-weight:600;
  list-style:none; display:flex; align-items:center; gap:7px;
}
.tl-poi summary::-webkit-details-marker{display:none}
.tl-poi summary::after{content:'\25BE'; margin-left:auto; color:var(--muted); font-size:.8em; transition:.2s}
.tl-poi[open] summary::after{transform:rotate(180deg)}
.tl-poi p{margin:0; padding:0 13px 11px; font-size:.85rem; line-height:1.55; color:var(--muted)}
.tl-more .t b{display:block; margin-bottom:2px}
.install-bar{
  position:sticky; top:0; z-index:4000;
  display:flex; align-items:center; gap:12px;
  background:var(--deep2); border-bottom:2.5px solid var(--gold);
  padding:14px 14px; padding-top:calc(14px + env(safe-area-inset-top));
  font-size:1rem; line-height:1.4; box-shadow:0 2px 12px rgba(0,0,0,.25);
}
.ib-ico{font-size:1.5rem; flex:none}
.ib-txt{flex:1; min-width:0}
.ib-go{
  flex:none; background:var(--gold); color:#08252e; border:none; border-radius:12px;
  padding:12px 18px; font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
  font-size:1rem; cursor:pointer;
}
.ib-go:active{transform:scale(.97)}
.ib-close{
  flex:none; width:42px; height:42px; border-radius:50%;
  border:1.5px solid var(--line); background:transparent; color:var(--muted);
  font-size:1.05rem; cursor:pointer;
}
.topline{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.ver{
  font-family:'Spline Sans Mono',monospace; font-size:.72rem; letter-spacing:.1em; font-weight:500;
  color:var(--gold); background:rgba(240,184,96,.12);
  border:1px solid rgba(240,184,96,.45); border-radius:999px; padding:4px 11px;
}
#theme-toggle{
  border:1px solid var(--line); background:var(--deep2); color:var(--ink);
  width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1.05rem;
  display:flex; align-items:center; justify-content:center; transition:.2s;
}
#theme-toggle:active{transform:scale(.92)}

/* ---------- mode clair ---------- */
[data-theme="light"]{
  --deep:#f4efe6; --deep2:#ffffff; --panel:#ece5d8; --line:#d8cfbc;
  --aqua:#0c7a6d; --gold:#a8720f; --ocre:#b45f22; --sage:#4d7a3f;
  --ink:#15292e; --muted:#5c6f6b; --danger:#b7402c;
}
[data-theme="light"] header{background:linear-gradient(180deg,#efe7d8 0%,var(--deep) 100%)}
[data-theme="light"] nav.tabs{background:rgba(244,239,230,.94)}
[data-theme="light"] .leaflet-container{background:#dfe8e6}
[data-theme="light"] .vlab{background:rgba(255,255,255,.92)!important; border-color:var(--line)!important; color:var(--ink)!important}
[data-theme="light"] .tile-warn{background:rgba(255,255,255,.94); color:var(--muted)}
[data-theme="light"] .stat b{color:var(--ink)}
[data-theme="light"] .badge{background:rgba(12,122,109,.08)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

/* ---- ajouts Bourgogne : itinérance, cascade, matériel ---- */
.chain{list-style:none;margin-top:6px}
.chain li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;
  padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s;border-radius:8px}
.chain li:active{transform:scale(.99);background:rgba(240,184,96,.10)}
.chain li:last-child{border-bottom:none}
.chain .dj{font-family:'Spline Sans Mono',monospace;font-size:.66rem;color:var(--gold);line-height:1.25}
.chain .dj i{display:block;font-style:normal;color:var(--muted);font-size:.6rem}
.chain .nm{font-size:.84rem;font-weight:600;line-height:1.3}
.chain .nm i{display:block;font-style:normal;font-weight:400;font-size:.68rem;color:var(--muted);margin-top:2px}
.chain .st{font-family:'Spline Sans Mono',monospace;font-size:.7rem;color:var(--muted);white-space:nowrap;text-align:right}
.chain li.repos{background:rgba(111,214,201,.07)}
.chain li.repos .dj{color:var(--aqua)}
.chain li.train .st{color:var(--aqua)}
.vbox{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.13)}
.vbox h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px;font-weight:600}
.vopt{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-radius:8px;cursor:pointer}
.vopt:active{background:rgba(240,184,96,.08)}
.vopt input{margin-top:3px;accent-color:var(--gold);width:18px;height:18px;flex:none}
.vopt .vt{font-size:.8rem;line-height:1.35}
.vopt .vt b{color:var(--ink)}
.vopt .vk{font-family:'Spline Sans Mono',monospace;font-size:.68rem;color:var(--gold);margin-left:4px}
.vopt .vk.neg{color:var(--aqua)}
.vopt .vd{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.cascade{margin-top:10px;font-size:.72rem;color:var(--aqua);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;
  padding:8px 13px;font:600 .8rem/1 'Spline Sans',sans-serif;cursor:pointer}
.backbar .ttl{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:.9rem}
.ckcat{margin-bottom:6px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 5px;border-radius:8px;cursor:pointer;font-size:.82rem;line-height:1.4}
.ck:active{background:rgba(240,184,96,.08)}
.ck input{margin-top:3px;accent-color:var(--aqua);width:18px;height:18px;flex:none}
.ck.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--aqua)}

/* =========================================================
   MOTEUR DE CASCADE — séquentiel, jour après jour
   Chaque journée : plus court (-1) · normal (0) · plus long (+1)
   Le choix décale la nuitée, et TOUT ce qui suit est recalculé
   sur la distance et les jours restants.
   ========================================================= */
function buildChain(){
  var chain = [];
  for(var i=0;i<CHAIN.length;i++){
    var n = CHAIN[i];
    if(n.n==='Saint-Jean-de-Losne' && i>0 && !STATE.opts.bouclage) continue;
    chain.push(Object.assign({}, n, {i:chain.length}));
  }
  return chain;
}
function chainCum(chain){
  var cum=[0];
  for(var i=1;i<chain.length;i++){ cum.push(cum[i-1]+chain[i].km); }
  return cum;
}
function computeStages(){
  var chain = buildChain();
  var cum = chainCum(chain);
  var M = chain.length, T = cum[M-1];
  var rideDays = TOTAL_DAYS;

  function bounds(cap, minSeg){
    var mn = new Array(M).fill(Infinity), mx = new Array(M).fill(-Infinity);
    mn[M-1] = 0; mx[M-1] = 0;
    for(var q=M-2; q>=0; q--){
      for(var k2=q+1; k2<M; k2++){
        var sg = cum[k2]-cum[q];
        if(sg > cap) break;
        if(mn[k2]!==Infinity){ mn[q] = Math.min(mn[q], 1+mn[k2]); }
        if(mx[k2]!==-Infinity && (sg >= minSeg || k2===M-1)){ mx[q] = Math.max(mx[q], 1+mx[k2]); }
      }
    }
    return {mn:mn, mx:mx};
  }

  /* index du maillon confirmé pour un jour donné, ou -1 */
  function doneIdx(day, after){
    var v = STATE.done['d'+day];
    if(v===undefined || v===null) return -1;
    if(typeof v === 'number'){ return (v>=0 && v<M) ? v : -1; }
    /* ancien format (nom) : on cherche la première occurrence APRÈS la position
       courante — indispensable car Saint-Jean-de-Losne apparaît deux fois. */
    for(var i=(after||0)+1; i<M; i++){ if(chain[i].n===v) return i; }
    for(var j=0;j<M;j++){ if(chain[j].n===v) return j; }
    return -1;
  }

  /* Passe 1 : où sommes-nous réellement après la dernière journée validée ?
     La réalité prime sur le plan — on adapte le plafond au reste à parcourir. */
  var lastDone = 0, lastDoneDay = 0;
  for(var dd=1; dd<=rideDays; dd++){
    var di = doneIdx(dd, lastDone);
    if(di > lastDone && (cum[di]-cum[lastDone]) <= 120){ lastDone = di; lastDoneDay = dd; }
  }
  var remainKm = T - cum[lastDone], remainDays = rideDays - lastDoneDay;
  var needAvg = remainDays > 0 ? remainKm/remainDays : 0;
  var CAP = Math.max(PLAN.cap, Math.ceil(needAvg*1.3/2)*2);
  var MINSEG = 12, capRaised = Math.max(0, CAP - PLAN.cap);
  var B = bounds(CAP, MINSEG), guard = 0;
  while(B.mn[0] > rideDays && CAP < 110 && guard++ < 25){ CAP += 4; capRaised += 4; B = bounds(CAP, MINSEG); }
  guard = 0;
  while(B.mx[0] < rideDays && MINSEG > 0 && guard++ < 20){ MINSEG = Math.max(0, MINSEG-3); B = bounds(CAP, MINSEG); }
  var minD = B.mn, maxD = B.mx;
  var LIMIT = Math.max(needAvg + 6, CAP - 10);

  /* Passe 2 : le déroulé, jour après jour */
  var stages = [], at = 0, behind = false;
  for(var day=1; day<=rideDays; day++){
    var left = rideDays - day + 1;
    var to, forced = false, confirmed = false;
    var opts = {court:null, normal:null, long:null};

    var fixed = doneIdx(day, at);
    /* garde-fou : une journée validée à plus de 120 km est une donnée aberrante
       (stockage corrompu, ancien format mal résolu) — on l'ignore. */
    if(fixed > at && (cum[fixed]-cum[at]) > 120){ fixed = -1; delete STATE.done['d'+day]; }
    if(fixed > at || (fixed === at && day <= lastDoneDay)){
      /* journée validée : le point d'arrivée est un fait, pas un calcul */
      to = Math.max(fixed, at);
      if(to === at && to < M-1){ to = at; }
      confirmed = true;
      opts = {court:null, normal:to, long:null};
    }else if(day === rideDays){
      to = M-1;
      opts = {court:null, normal:M-1, long:null};
    }else{
      var remain = T - cum[at];
      var target = remain / left;
      var choice = (STATE.days['d'+day]===-1 || STATE.days['d'+day]===1) ? STATE.days['d'+day] : 0;

      var hard = [], soft = [];
      for(var j=at+1; j<=M-1-(left-1); j++){
        var seg = cum[j]-cum[at];
        if(seg > CAP) break;
        if(seg < MINSEG && left>1) continue;
        var restDays = left-1;
        if(restDays > 0 && !(minD[j] <= restDays && restDays <= maxD[j])) continue;
        hard.push(j);
        if(restDays === 0 || (T-cum[j])/restDays <= LIMIT){ soft.push(j); }
      }
      var cands = soft.length ? soft : hard;
      if(!cands.length){
        forced = true; behind = true;
        var far = -1;
        for(var j2=at+1; j2<M; j2++){
          if(cum[j2]-cum[at] > CAP) break;
          if(minD[j2] <= left-1) far = j2;
        }
        if(far < 0){ for(var j3=at+1; j3<M; j3++){ if(cum[j3]-cum[at] <= CAP) far = j3; } }
        cands = [far>0 ? far : Math.min(at+1, M-1)];
      }else if(!soft.length){
        forced = true;
        cands = [hard[hard.length-1]];
      }
      var best = cands[0], bd = Infinity;
      cands.forEach(function(k){
        var dv = Math.abs((cum[k]-cum[at]) - target);
        if(dv < bd){ bd = dv; best = k; }
      });
      var pos = cands.indexOf(best);
      var pick = forced ? pos : Math.min(cands.length-1, Math.max(0, pos + choice));
      to = cands[pick];
      opts = {court: pos>0 ? cands[pos-1] : null,
              normal: cands[pos],
              long: pos<cands.length-1 ? cands[pos+1] : null};
    }
    if(to <= at && at < M-1){ to = Math.min(at+1, M-1); }

    var via = [];
    for(var v=at+1; v<to; v++){ via.push(chain[v]); }
    var surfs = {};
    for(var sf=at+1; sf<=to; sf++){ surfs[chain[sf].surf] = (surfs[chain[sf].surf]||0)+chain[sf].km; }
    stages.push({
      type:'ride', from:chain[at], to:chain[to], via:via,
      km: cum[to]-cum[at], pts:[chain[at]].concat(via,[chain[to]]),
      opts:opts, applied:(to===opts.normal?0:(to===opts.court?-1:(to===opts.long?1:0))),
      forced:forced, confirmed:confirmed, chain:chain, cum:cum, surfs:surfs,
      kmCourt: opts.court!=null ? cum[opts.court]-cum[at] : null,
      kmLong:  opts.long!=null  ? cum[opts.long]-cum[at]  : null
    });
    at = to;
    if(at >= M-1 && day < rideDays){
      /* arrivée atteinte avant la fin : les jours restants sont libres */
      for(var extra=day+1; extra<=rideDays; extra++){
        stages.push({type:'free', at:chain[M-1]});
      }
      break;
    }
  }

  var rideNo = 0;
  stages.forEach(function(st,i){
    var dt = new Date(DATE0.getTime());
    dt.setDate(dt.getDate()+i);
    st.day = i+1;
    st.date = dt;
    st.dstr = JOURS[dt.getDay()]+' '+dt.getDate()+' '+MOIS[dt.getMonth()];
    st.id = 'e'+(i+1);
    st.color = DAYCOLORS[i%DAYCOLORS.length];
    if(st.type==='ride'){ rideNo++; st.rideNo = rideNo; }
  });
  return {stages:stages, chain:chain, total:T, rideDays:rideDays, rest:0, restReduced:0,
          cap:CAP, capRaised:capRaised, behind:behind,
          lastDoneDay:lastDoneDay, doneKm:cum[lastDone], remainKm:remainKm, remainDays:remainDays,
          needAvg:needAvg};
}

/* =========================================================
   4. RENDU · CARTES · ROUTAGE · GPX · MODE GUIDON
   ========================================================= */
var RUN = computeStages();
var maps = {};
var ROUTED = {};
var REAL = {};
try{ REAL = JSON.parse(localStorage.getItem('bourgreal-'+GEN)||'{}'); }catch(e){ REAL = {}; }
function saveReal(){ try{ localStorage.setItem('bourgreal-'+GEN, JSON.stringify(REAL)); }catch(e){} }

var mainEl = document.getElementById('main');
var tabsEl = document.getElementById('tabs');
var currentTab = 'sejour';
var openStage = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function distM(a,b){
  var R=6371000, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  var la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
  var x=Math.sin(dLat/2), y=Math.sin(dLon/2);
  var h=x*x+Math.cos(la1)*Math.cos(la2)*y*y;
  return 2*R*Math.asin(Math.sqrt(h));
}
function stageKey(st){
  return 'bourgrt-'+GEN+'-'+st.pts.map(function(p){return p.n;}).join('_').replace(/[^A-Za-z0-9_]/g,'').slice(0,90);
}
function realKm(st){ var r = REAL[stageKey(st)]; return (typeof r==='number') ? r : null; }
function kmLabel(st){
  if(st.type==='rest') return 'repos';
  var r = realKm(st);
  return r!==null ? (r+' km') : ('\u2248 '+Math.round(st.km)+' km');
}

/* ---------- routage BRouter ---------- */
function getRoute(st, cb){
  var key = stageKey(st);
  try{
    var c = localStorage.getItem(key);
    if(c){ cb(JSON.parse(c), 'cache'); return; }
  }catch(e){}
  var wps = st.pts.map(function(p){ return p.ll[1].toFixed(5)+','+p.ll[0].toFixed(5); });
  var url = 'https://brouter.de/brouter?lonlats='+wps.join('|')+'&profile=trekking&alternativeidx=0&format=geojson';
  function attempt(left){
    fetch(url).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(gj){
      var f = gj && gj.features && gj.features[0];
      if(!f) throw new Error('vide');
      var co = f.geometry.coordinates.map(function(q){
        return [ +q[1].toFixed(5), +q[0].toFixed(5), (q.length>2 && q[2]!=null) ? Math.round(q[2]) : null ];
      });
      if(co.length > 900){
        var step = Math.ceil(co.length/900), o=[];
        for(var i=0;i<co.length;i+=step){ o.push(co[i]); }
        if(o[o.length-1]!==co[co.length-1]) o.push(co[co.length-1]);
        co = o;
      }
      try{ localStorage.setItem(key, JSON.stringify(co)); }catch(e){}
      cb(co, 'live');
    }).catch(function(){
      if(left>0){ setTimeout(function(){ attempt(left-1); }, 1500); }
      else{ cb(null,'fail'); }
    });
  }
  attempt(2);
}
function buildProfile(co){
  if(!co || co.length<2 || co[0][2]==null) return null;
  var km=[0], el=[co[0][2]];
  for(var i=1;i<co.length;i++){
    km.push(km[i-1]+distM(co[i-1],co[i])/1000);
    el.push(co[i][2]==null?el[i-1]:co[i][2]);
  }
  var sm=[], W=3;
  for(var i2=0;i2<el.length;i2++){
    var a=0,c=0;
    for(var j=Math.max(0,i2-W);j<=Math.min(el.length-1,i2+W);j++){ a+=el[j]; c++; }
    sm.push(a/c);
  }
  var dp=0;
  for(var i3=1;i3<sm.length;i3++){ var d=sm[i3]-sm[i3-1]; if(d>0) dp+=d; }
  var prof=[], N=Math.min(120, sm.length);
  for(var i4=0;i4<N;i4++){
    var idx=Math.round(i4*(sm.length-1)/(N-1));
    prof.push([+km[idx].toFixed(1), Math.round(sm[idx])]);
  }
  return {prof:prof, dplus:Math.round(dp/10)*10, totalKm:Math.round(km[km.length-1])};
}
function profileSvg(prof){
  if(!prof || prof.length<2){ return '<p class="map-note">Profil disponible dès le chargement de la carte.</p>'; }
  var W=600,H=130,padL=34,padR=8,padT=10,padB=22;
  var maxKm=prof[prof.length-1][0]||1;
  var alts=prof.map(function(p){return p[1];});
  var minA=Math.min.apply(null,alts), maxA=Math.max.apply(null,alts);
  if(maxA-minA<40){ maxA=minA+40; }
  function X(k){ return padL+(k/maxKm)*(W-padL-padR); }
  function Y(a){ return padT+(1-(a-minA)/(maxA-minA))*(H-padT-padB); }
  var d='M'+X(prof[0][0]).toFixed(1)+','+Y(prof[0][1]).toFixed(1);
  for(var i=1;i<prof.length;i++){ d+='L'+X(prof[i][0]).toFixed(1)+','+Y(prof[i][1]).toFixed(1); }
  var area=d+'L'+X(maxKm)+','+(H-padB)+'L'+X(0)+','+(H-padB)+'Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Profil de dénivelé">'
    +'<path d="'+area+'" fill="rgba(240,184,96,.16)"></path>'
    +'<path d="'+d+'" fill="none" stroke="#f0b860" stroke-width="2"></path>'
    +'<text x="2" y="'+(Y(maxA)+4)+'" fill="#8fb3ad" font-size="11">'+Math.round(maxA)+'</text>'
    +'<text x="2" y="'+(Y(minA)+4)+'" fill="#8fb3ad" font-size="11">'+Math.round(minA)+'</text>'
    +'<text x="'+(W-40)+'" y="'+(H-6)+'" fill="#8fb3ad" font-size="11">'+Math.round(maxKm)+' km</text>'
    +'</svg>';
}

/* ---------- GPX ---------- */
function toGpx(name, co){
  var pts = co.map(function(c){
    return '      <trkpt lat="'+c[0]+'" lon="'+c[1]+'">'+(c[2]!=null?'<ele>'+c[2]+'</ele>':'')+'</trkpt>';
  }).join('\n');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Tour de Bourgogne" xmlns="http://www.topografix.com/GPX/1/1">\n'
    +'  <metadata><name>'+name+'</name></metadata>\n  <trk>\n    <name>'+name+'</name>\n    <trkseg>\n'
    +pts+'\n    </trkseg>\n  </trk>\n</gpx>\n';
}
function downloadGpx(sid){
  var st = RUN.stages.find(function(s){ return s.id===sid; });
  if(!st) return;
  var co = ROUTED[sid] || (st.pts||[]).map(function(p){ return [p.ll[0],p.ll[1],null]; });
  var nm = 'J'+st.day+' '+st.from.n+' - '+st.to.n;
  var blob = new Blob([toGpx(nm, co)], {type:'application/gpx+xml'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nm.replace(/[^A-Za-z0-9 -]/g,'').replace(/\s+/g,'-')+'.gpx';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadAllGpx(){
  var co = [];
  RUN.stages.forEach(function(st){
    if(st.type!=='ride') return;
    var c = ROUTED[st.id];
    if(c){ co = co.concat(c); }
    else{ st.pts.forEach(function(p){ co.push([p.ll[0],p.ll[1],null]); }); }
  });
  var blob = new Blob([toGpx('Tour de Bourgogne 2026 - parcours complet', co)], {type:'application/gpx+xml'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Tour-de-Bourgogne-2026-complet.gpx';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- cartes ---------- */
function startIcon(){
  return L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15],
    html:'<div style="width:30px;height:30px;border-radius:50%;background:#f0b860;border:3px solid #08252e;'
      +'display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.5)">\u2605</div>'});
}
function dotIcon(txt, col){
  return L.divIcon({className:'', iconSize:[24,24], iconAnchor:[12,12],
    html:'<div style="width:24px;height:24px;border-radius:50%;background:'+col+';border:2px solid #08252e;'
      +'display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.45)">'+txt+'</div>'});
}
function makeMap(elId){
  var m = L.map(elId, {scrollWheelZoom:false, zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:17, attribution:'&copy; OpenStreetMap · routage BRouter'}).addTo(m);
  return m;
}
function addLocate(m){
  var btn = L.control({position:'topright'});
  btn.onAdd = function(){
    var a = L.DomUtil.create('a','loc-btn');
    a.href='#'; a.title='Ma position'; a.innerHTML='\ud83d\udccd';
    a.style.cssText='width:34px;height:34px;display:flex;align-items:center;justify-content:center;'
      +'background:#10394a;border:1px solid #1c4a5c;border-radius:8px;font-size:17px;text-decoration:none';
    L.DomEvent.on(a,'click',function(ev){
      L.DomEvent.stop(ev);
      if(m._locating){ m.stopLocate(); m._locating=false; a.style.background='#10394a'; if(m._lm){ m.removeLayer(m._lm); m._lm=null; } return; }
      m._locating = true; a.style.background='#f0b860';
      m.locate({watch:true, enableHighAccuracy:true});
    });
    return a;
  };
  btn.addTo(m);
  m.on('locationfound', function(e){
    if(m._lm){ m.removeLayer(m._lm); }
    m._lm = L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:2,fillColor:'#4a9eff',fillOpacity:1}).addTo(m);
    if(m._follow){ m.setView(e.latlng, Math.max(m.getZoom(),14)); }
  });
  m._locBtn = btn;
}

function initStageMap(st){
  if(maps[st.id]){ setTimeout(function(){ maps[st.id].invalidateSize(); },60); return; }
  var el = document.getElementById('map-'+st.id);
  if(!el || typeof L==='undefined') return;
  var m = makeMap('map-'+st.id);
  maps[st.id] = m;
  addLocate(m);
  var raw = st.pts.map(function(p){ return p.ll; });
  var line = L.polyline(raw, {color:st.color, weight:3, opacity:.75, dashArray:'6 8'}).addTo(m);
  st.pts.forEach(function(p,i){
    var isEnd = (i===0 || i===st.pts.length-1);
    L.marker(p.ll, {icon: i===0 ? dotIcon('\u25b6','#f0b860') : (isEnd ? dotIcon('\ud83c\udfd5','#6fd6c9') : dotIcon(''+i,'#9fc48f'))})
     .addTo(m)
     .bindPopup('<b>'+esc(p.n)+'</b>'+(p.voir?'<br><span style="font-size:.8em">'+p.voir+'</span>':'')
       +(isEnd&&i>0&&p.camp?'<br><br>\ud83c\udfd5 '+esc(p.camp):''));
  });
  function fitStage(){
    if(!m._container || !m._container.parentNode || maps[st.id]!==m) return;
    try{
      m.invalidateSize();
      if(!m._userMoved){ m.fitBounds(line.getBounds(), {padding:[26,26]}); }
    }catch(e){}
  }
  fitStage();
  setTimeout(fitStage, 160);
  setTimeout(fitStage, 600);
  m.on('zoomstart dragstart', function(){ m._userMoved = true; });

  var note = document.getElementById('rt-'+st.id);
  if(note){ note.textContent = 'Tracé schématique — affinage par routage en cours…'; }
  getRoute(st, function(co, src){
    if(!co){
      if(note){ note.textContent = 'Routage indisponible — tracé schématique conservé. Recharge pour réessayer.'; }
      return;
    }
    ROUTED[st.id] = co;
    m.removeLayer(line);
    var ll = co.map(function(c){ return [c[0],c[1]]; });
    L.polyline(ll,{color:'#08252e',weight:6,opacity:.45}).addTo(m);
    L.polyline(ll,{color:st.color,weight:3,opacity:.95}).addTo(m);
    var pr = buildProfile(co);
    if(pr){
      var pe = document.getElementById('prof-'+st.id);
      if(pe){ pe.innerHTML = profileSvg(pr.prof); }
      var pn = document.getElementById('profnote-'+st.id);
      if(pn){ pn.textContent = 'Profil réel : '+pr.totalKm+' km · '+pr.dplus+' m de dénivelé positif (altitudes du routage).'; }
      if(pr.totalKm>0){
        var est = st.km, ok = Math.abs(pr.totalKm-est)/Math.max(est,1) < 0.40;
        if(ok){ REAL[stageKey(st)] = pr.totalKm; saveReal(); }
        var ke = document.getElementById('km-'+st.id);
        if(ke && ok){ ke.textContent = pr.totalKm+' km'; }
        var de = document.getElementById('dp-'+st.id);
        if(de){ de.textContent = pr.dplus+' m'; }
      }
    }
    if(note){ note.textContent = 'Tracé réel (routage vélo BRouter'+(src==='cache'?', en cache':'')+') — suit chemins de halage et petites routes.'; }
    loadStageWater(st, m);
  });
  if(ROUTED[st.id]) loadStageWater(st, m);
}

/* points d'eau de l'étape : marqueurs + liste triée par détour */
function loadStageWater(st, m){
  if(m._eauDone) return;
  m._eauDone = true;
  var box = document.getElementById('eau-'+st.id);
  if(box){ box.innerHTML = '<p class="mapstatus2" style="display:block">Recherche des points d\u2019eau à moins de 2 km\u2026</p>'; }
  getWater(st, function(list){
    if(!list){
      if(box){ box.innerHTML = '<p class="mapstatus2" style="display:block;color:var(--danger)">Points d\u2019eau indisponibles (serveur OpenStreetMap injoignable). Recharge la page pour réessayer \u2014 à faire en wifi avant le départ.</p>'; }
      return;
    }
    var g = L.layerGroup().addTo(m);
    list.forEach(function(wp){
      var stl = WSTYLE[wp[2]] || WSTYLE.tap;
      L.marker([wp[0],wp[1]],{icon:dotIcon(stl.ico, stl.col)}).addTo(g)
       .bindPopup('<b>'+(wp[4]||stl.lab)+'</b><br><span style="font-size:.85em">'+stl.lab+'<br>\u2248 '+wp[3]+' m du tracé</span>'
         +'<br><a href="https://www.google.com/maps?q='+wp[0]+','+wp[1]+'" target="_blank" rel="noopener">Ouvrir dans Maps</a>');
    });
    if(!box) return;
    if(!list.length){
      box.innerHTML = '<p class="mapstatus2" style="display:block">Aucun point d\u2019eau cartographié à moins de 2 km sur cette étape. Réflexe de secours : le <b>cimetière</b> de n\u2019importe quel village \u2014 robinet quasi systématique \u2014 ou demander à une écluse.</p>';
      return;
    }
    var taps = list.filter(function(w){ return w[2]!=='cim'; });
    var cims = list.filter(function(w){ return w[2]==='cim'; });
    var h = '<p class="mapstatus2" style="display:block">'+taps.length+' point'+(taps.length>1?'s':'')+' d\u2019eau potable et '+cims.length+' cimetière'+(cims.length>1?'s':'')+' à moins de 2 km \u00b7 coordonnées OpenStreetMap, gardées hors ligne.</p><div class="wlist">';
    list.slice(0,14).forEach(function(w){
      var stl = WSTYLE[w[2]] || WSTYLE.tap;
      h += '<div class="wrow"><span class="wi">'+stl.ico+'</span>'
        +'<span class="wt"><b>'+(w[4]||stl.lab)+'</b><i>'+stl.lab+'</i></span>'
        +'<a class="wd" href="https://www.google.com/maps?q='+w[0]+','+w[1]+'" target="_blank" rel="noopener">'+w[3]+' m</a></div>';
    });
    h += '</div>';
    box.innerHTML = h;
  });
}

function initOverviewMap(){
  if(maps.apercu){ setTimeout(function(){ maps.apercu.invalidateSize(); },60); return; }
  var el = document.getElementById('map-apercu');
  if(!el || typeof L==='undefined') return;
  var m = makeMap('map-apercu');
  maps.apercu = m;
  addLocate(m);

  /* --- couche 1 : le tracé et les étapes --- */
  var gTrace = L.layerGroup().addTo(m);
  var gCamps = L.layerGroup();
  var gBains = L.layerGroup();
  var gEau = L.layerGroup();
  var gVelo = L.layerGroup();
  m._g = {trace:gTrace, camps:gCamps, bains:gBains, eau:gEau, velo:gVelo};

  var all = [];
  var rides = RUN.stages.filter(function(s){ return s.type==='ride'; });
  var sketch = {};                      /* trait provisoire, effacé dès le routage */
  rides.forEach(function(st){
    var raw = st.pts.map(function(p){ return p.ll; });
    all = all.concat(raw);
    sketch[st.id] = L.polyline(raw,{color:st.color,weight:2,opacity:.5,dashArray:'5 7'}).addTo(gTrace)
     .bindTooltip('J'+st.day+' \u00b7 '+st.from.n+' \u2192 '+st.to.n+' \u00b7 '+kmLabel(st)+' (tracé en cours de calcul)');
  });
  L.marker(START,{icon:startIcon()}).addTo(gTrace)
   .bindPopup(START_POPUP + '<br><br><b>Départ J1 et arrivée J'+RUN.rideDays+'</b> \u2014 la boucle se referme ici.')
   .bindTooltip('D\u00e9part &amp; arriv\u00e9e');

  /* --- couche 3 : TOUS les campings du parcours --- */
  var nCamps = 0;
  RUN.chain.forEach(function(n){
    if(!n.camps || !n.camps.length) return;
    nCamps += n.camps.length;
    var html = '<b>'+esc(n.n)+'</b>';
    n.camps.forEach(function(c){
      html += '<br><br>\ud83c\udfd5 <b>'+c.n+'</b><br><span style="font-size:.85em">'+c.t+'<br>\u2600\ufe0f '+c.c+'</span>';
    });
    L.marker(n.ll,{icon:dotIcon('\ud83c\udfd5','#9fc48f')}).addTo(gCamps).bindPopup(html);
  });

  /* --- couche 4 : les points d'eau où se baigner --- */
  var nBains = 0;
  RUN.chain.forEach(function(n){
    var b = BAIN[n.n];
    if(!b) return;
    nBains++;
    var st2 = BAINSTYLE[b.t];
    L.marker([n.ll[0]+0.004, n.ll[1]+0.004],{icon:dotIcon(st2.ico, st2.col)})
     .addTo(gBains)
     .bindPopup('<b>'+esc(n.n)+'</b><br><span style="font-size:.85em">'+st2.lab+'</span><br>'+b.d);
  });

  /* --- couches réseau : chargement PAR JOURNÉE, à la demande ---------------
     Une requête pour tout le parcours sature Overpass. Ici, chaque journée est
     une requête minuscule (une bbox d'étape), déclenchée par un appui sur le
     numéro du jour, et conservée séparément. On charge à son rythme, et une
     journée déjà chargée n'est jamais redemandée. */
  m._dayState = {};                       /* 'ok' | 'load' | 'fail' par jour */
  m._dayG = {};                           /* un groupe de marqueurs PAR journée */
  m._shown = {};                          /* journées actuellement affichées */
  try{ m._shown = JSON.parse(localStorage.getItem('bourg-shown')||'{}') || {}; }catch(e){ m._shown = {}; }
  function saveShown(){ try{ localStorage.setItem('bourg-shown', JSON.stringify(m._shown)); }catch(e){} }
  function dayGroup(kind, day){
    var k = kind+day;
    if(!m._dayG[k]){ m._dayG[k] = L.layerGroup(); }
    return m._dayG[k];
  }
  function showDay(day, on){
    ['eau','velo'].forEach(function(kind){
      var host = (kind==='eau') ? gEau : gVelo;
      var g = m._dayG[kind+day];
      if(!g) return;
      if(on){ if(!host.hasLayer(g)) host.addLayer(g); }
      else  { if(host.hasLayer(g))  host.removeLayer(g); }
    });
    m._shown[day] = !!on;
    saveShown();
    tally(); paintDay(day);
  }
  m._showDay = showDay;

  function dayKey(kind, st){
    return 'bourgday-'+kind+'-'+(st.from.n+'_'+st.to.n)
           .replace(/[^A-Za-z0-9_]/g,'').slice(0,50);
  }
  function drawEau(wp, day){
    var stl = WSTYLE[wp[2]] || WSTYLE.tap;
    L.marker([wp[0],wp[1]],{icon:dotIcon(stl.ico, stl.col)}).addTo(dayGroup('eau', day))
     .bindPopup('<b>'+(wp[3]||stl.lab)+'</b><br><span style="font-size:.85em">'+stl.lab+'</span>'
       +'<br><a href="https://www.google.com/maps?q='+wp[0]+','+wp[1]+'" target="_blank" rel="noopener">Maps</a>');
  }
  function drawVelo(vp, day){
    var stl = VSTYLE[vp[2]] || VSTYLE.bike;
    L.marker([vp[0],vp[1]],{icon:dotIcon(stl.ico, stl.col)}).addTo(dayGroup('velo', day))
     .bindPopup('<b>'+(vp[3]||stl.lab)+'</b><br><span style="font-size:.85em">'+stl.lab+'</span>'
       +(vp[4]?'<br><a href="tel:'+vp[4].replace(/\s/g,'')+'">'+vp[4]+'</a>':'')
       +'<br><a href="https://www.google.com/maps?q='+vp[0]+','+vp[1]+'" target="_blank" rel="noopener">Maps</a>');
  }
  function tally(){
    var ne=0, nv=0;
    gEau.eachLayer(function(g){ if(g.eachLayer){ g.eachLayer(function(){ ne++; }); } else { ne++; } });
    gVelo.eachLayer(function(g){ if(g.eachLayer){ g.eachLayer(function(){ nv++; }); } else { nv++; } });
    var ce=document.getElementById('cnt-eau'); if(ce) ce.textContent = ne;
    var cv=document.getElementById('cnt-velo'); if(cv) cv.textContent = nv;
  }
  function paintDay(day){
    var b = document.querySelector('.dbtn[data-day="'+day+'"]');
    if(!b) return;
    var st = m._dayState[day]||'';
    if(st==='ok'){ b.className = 'dbtn ' + (m._shown[day]===false ? 'off' : 'ok'); }
    else { b.className = 'dbtn ' + st; }
  }
  m._tallyDays = function(){
    var kinds = [];
    if(LAYERS.eau)  kinds.push('eau');
    if(LAYERS.velo) kinds.push('velo');
    rides.forEach(function(st){
      if(m._dayState[st.day]==='load') return;      /* en cours : on n'y touche pas */
      if(!kinds.length){ m._dayState[st.day]=''; paintDay(st.day); return; }
      /* une journée n'est « chargée » que si TOUTES les couches actives le sont */
      var done = true;
      kinds.forEach(function(k){
        if(localStorage.getItem(dayKey(k, st))===null){ done = false; }
      });
      m._dayState[st.day] = done ? 'ok' : '';
      paintDay(st.day);
    });
  };

  /* Charge une journée : au plus 2 petites requêtes (eau, vélocistes). */
  m._loadDay = function(day, silent, done){
    var st = null;
    rides.forEach(function(x){ if(x.day===day) st = x; });
    if(!st){ if(done) done(false); return; }
    if(m._dayState[day]==='load'){ if(done) done(false); return; }
    m._dayState[day]='load'; paintDay(day);
    var stat = document.getElementById('eau-stat');
    function note(t){ if(stat && !silent){ stat.style.display='block'; stat.textContent=t; } }

    var kinds = [];
    if(LAYERS.eau)  kinds.push('eau');
    if(LAYERS.velo) kinds.push('velo');
    if(!kinds.length){ m._dayState[day]=''; paintDay(day); if(done) done(false); return; }

    var ki = 0, anyFail = false;
    (function nextKind(){
      if(ki >= kinds.length){
        m._dayState[day] = anyFail ? 'fail' : 'ok';
        if(!anyFail){ showDay(day, true); }
        paintDay(day); tally();
        note(anyFail ? ('J'+day+' : échec, retouche le bouton pour réessayer')
                     : ('J'+day+' chargé \u00b7 conservé hors ligne'));
        if(done) done(!anyFail);
        return;
      }
      var kind = kinds[ki], KEY = dayKey(kind, st);
      var cached = null;
      try{ cached = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
      if(cached){
        cached.forEach(function(r){ (kind==='eau'?drawEau:drawVelo)(r, day); });
        ki++; nextKind(); return;
      }
      note('J'+day+' \u2014 '+(kind==='eau'?'points d\u2019eau':'vélocistes')+'\u2026');
      withRoute(st, function(){
        var line = routeLine(st);
        var bb = bboxOf(line, kind==='eau' ? 0.03 : 0.06).join(',');
        var q = (kind==='eau')
          ? ('[out:json][timeout:45];('
             + 'node["amenity"="drinking_water"]('+bb+');'
             + 'node["man_made"="water_tap"]["drinking_water"!="no"]('+bb+');'
             + 'node["amenity"="water_point"]('+bb+');'
             + 'nwr["landuse"="cemetery"]('+bb+');'
             + ');out center 250;')
          : ('[out:json][timeout:45];('
             + 'nwr["shop"="bicycle"]('+bb+');'
             + 'nwr["name"~"Decathlon",i]('+bb+');'
             + ');out center 120;');
        overpassQuery(q, function(j){
          if(!j){ anyFail = true; ki++; setTimeout(nextKind, 500); return; }
          var out = [], seen = {};
          var maxM = (kind==='eau') ? WATER_MAX_M : VELO_MAX_M;
          (j.elements||[]).forEach(function(e){
            var la = e.lat!=null ? e.lat : (e.center && e.center.lat);
            var lo = e.lon!=null ? e.lon : (e.center && e.center.lon);
            if(la==null || lo==null) return;
            var t = e.tags||{};
            var rec = null;
            if(kind==='eau'){
              var k2 = (t.amenity==='drinking_water' || t.man_made==='water_tap') ? 'tap'
                     : (t.amenity==='water_point' ? 'point'
                     : (t.landuse==='cemetery' ? 'cim' : null));
              if(!k2) return;
              rec = [+la.toFixed(5), +lo.toFixed(5), k2, (t.name||'').replace(/[<>&"]/g,' ').slice(0,40)];
            }else{
              var nm = (t.name||'').trim();
              var isD = /decathlon/i.test(nm) || /decathlon/i.test(t.brand||'');
              if(!isD && t.shop!=='bicycle') return;
              rec = [+la.toFixed(5), +lo.toFixed(5), isD?'deca':'bike',
                     nm.replace(/[<>&"]/g,' ').slice(0,40),
                     (t.phone||t['contact:phone']||'').replace(/[<>&"]/g,' ').slice(0,20)];
            }
            var id = la.toFixed(4)+','+lo.toFixed(4);
            if(seen[id]) return;
            if(distToLine([la,lo], line) > maxM) return;
            seen[id] = 1;
            out.push(rec);
          });
          try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){}
          out.forEach(function(r){ (kind==='eau'?drawEau:drawVelo)(r, day); });
          tally();
          ki++;
          setTimeout(nextKind, 800);
        }, note);
      });
    })();
  };

  /* Charge toutes les journées à la file, en s'arrêtant si ça bloque. */
  m._loadAllDays = function(){
    var i = 0, consecFail = 0;
    var stat = document.getElementById('eau-stat');
    (function next(){
      if(i >= rides.length){
        if(stat){ stat.style.display='block'; stat.textContent = 'Chargement terminé.'; }
        return;
      }
      var day = rides[i].day;
      if(m._dayState[day]==='ok'){ i++; next(); return; }
      m._loadDay(day, false, function(okDay){
        consecFail = okDay ? 0 : consecFail+1;
        i++;
        if(consecFail >= 2){
          if(stat){ stat.style.display='block';
            stat.textContent = 'Interrompu : les serveurs refusent. Reprends jour par jour dans un moment.'; }
          return;
        }
        setTimeout(next, 2500);
      });
    })();
  };

  if(LAYERS.camps)  gCamps.addTo(m);
  if(LAYERS.bains)  gBains.addTo(m);
  if(LAYERS.eau)  gEau.addTo(m);
  if(LAYERS.velo) gVelo.addTo(m);
  setTimeout(function(){
    /* réaffiche sans réseau tout ce qui est déjà en cache */
    rides.forEach(function(st){
      var any = false;
      if(LAYERS.eau){
        try{ var ce=JSON.parse(localStorage.getItem(dayKey('eau',st))||'null');
             if(ce){ ce.forEach(function(r){ drawEau(r, st.day); }); any = true; } }catch(e){}
      }
      if(LAYERS.velo){
        try{ var cv=JSON.parse(localStorage.getItem(dayKey('velo',st))||'null');
             if(cv){ cv.forEach(function(r){ drawVelo(r, st.day); }); any = true; } }catch(e){}
      }
      if(any){ showDay(st.day, m._shown[st.day] !== false); }
    });
    /* rattache les groupes selon l'état d'affichage mémorisé */
    rides.forEach(function(st){
      var has = (m._dayG['eau'+st.day] || m._dayG['velo'+st.day]);
      if(has){ showDay(st.day, m._shown[st.day] !== false); }
    });
    tally(); m._tallyDays();
  }, 60);

  var cc = document.getElementById('cnt-camps'); if(cc) cc.textContent = nCamps;
  var cb = document.getElementById('cnt-bains'); if(cb) cb.textContent = nBains;

  /* La taille du conteneur n'est pas encore connue au moment du rendu :
     il faut invalidateSize() AVANT fitBounds(), sinon Leaflet calcule le
     zoom sur une taille fausse et la carte reste zoomée sur le centre. */
  m._allBounds = all.length ? L.latLngBounds(all) : null;
  function fitAll(){
    if(!m._container || !m._container.parentNode || maps.apercu!==m) return;   /* carte remplacée */
    try{
      m.invalidateSize();
      if(m._allBounds && !m._userMoved){ m.fitBounds(m._allBounds, {padding:[24,24]}); }
    }catch(e){}
  }
  fitAll();
  setTimeout(fitAll, 160);
  setTimeout(fitAll, 600);
  m.on('zoomstart dragstart', function(){ m._userMoved = true; });

  /* affinage progressif du tracé, séquentiel pour ménager le serveur */
  (function next(i){
    if(i>=rides.length) return;
    getRoute(rides[i], function(co){
      if(co){
        ROUTED[rides[i].id] = co;
        /* le tracé réel remplace le trait provisoire : un seul trait à l'écran */
        if(sketch[rides[i].id]){ gTrace.removeLayer(sketch[rides[i].id]); delete sketch[rides[i].id]; }
        L.polyline(co.map(function(c){return [c[0],c[1]];}),{color:rides[i].color,weight:3,opacity:.95}).addTo(gTrace)
         .bindTooltip('J'+rides[i].day+' \u00b7 '+rides[i].from.n+' \u2192 '+rides[i].to.n+' \u00b7 '+kmLabel(rides[i]));
      }
      setTimeout(function(){ next(i+1); }, co ? 120 : 900);
    });
  })(0);
}

function toggleLayer(key, on){
  LAYERS[key] = on; saveLayers();
  var m = maps.apercu;
  if(!m || !m._g) return;
  var g = m._g[key];
  if(!g) return;
  if(on){
    g.addTo(m);
    var dw = document.getElementById('day-wrap');
    if(dw){ dw.style.display = (LAYERS.eau || LAYERS.velo) ? 'block' : 'none'; }
    if(m._tallyDays) m._tallyDays();
  } else {
    m.removeLayer(g);
    var st1 = document.getElementById('eau-stat');
    if(key==='eau' && st1){ st1.style.display='none'; }
    var st3 = document.getElementById('velo-stat');
    if(key==='velo' && st3){ st3.style.display='none'; }
  }
}


/* =========================================================
   REQUÊTES OVERPASS — une seule par couche, pour tout le parcours
   Les 17 requêtes rapprochées d'avant déclenchaient le quota
   d'Overpass (429/504) : le chargement s'arrêtait en cours de
   route. On utilise maintenant le filtre (around: rayon, liste de
   coordonnées) introduit en 0.7.55, qui filtre le corridor côté
   serveur, avec réessais espacés et bascule sur un miroir.
   ========================================================= */
var OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.osm.jp/api/interpreter',
  'https://overpass.osm.ch/api/interpreter'
];

/* UNE SEULE file d'attente, tous appelants confondus. Overpass n'accorde que
   deux créneaux par IP : deux couches interrogées en parallèle se faisaient
   refuser mutuellement. */
var OQ = {busy:false, list:[]};
/* Alias : point d'entrée unique, la file sérialise et espace les requêtes. */
function overpassQuery(q, onDone, onNote){ overpassQueue(q, onDone, onNote); }
function overpassQueue(q, onDone, onNote){
  OQ.list.push({q:q, onDone:onDone, onNote:onNote});
  overpassPump();
}
function overpassPump(){
  if(OQ.busy || !OQ.list.length) return;
  OQ.busy = true;
  var job = OQ.list.shift();
  var released = false;
  function release(){
    if(released) return;
    released = true;
    setTimeout(function(){ OQ.busy = false; overpassPump(); }, 1200);
  }
  /* Chien de garde : si le traitement d'une réponse plante ou ne rend jamais la
     main, la file restait bloquée pour toujours — la 1re requête passait et
     toutes les suivantes attendaient en silence. */
  var wd = setTimeout(function(){ release(); }, 120000);
  overpassRun(job.q, function(j){
    clearTimeout(wd);
    try{ job.onDone(j); }
    catch(e){ console.error('Overpass onDone:', e); }
    finally{ release(); }
  }, job.onNote);
}
function overpassRun(q, onDone, onNote){
  /* Stratégie : on essaie TOUS les miroirs d'affilée, sans attendre, avant de
     patienter. Un serveur saturé répond en une seconde ; inutile de perdre
     30 s sur lui alors qu'un autre est peut-être libre. Ce n'est qu'après un
     tour complet infructueux qu'on temporise. */
  var round = 0, idx = 0, lastWhy = '';
  function go(){
    var base = OVERPASS[idx];
    var useGet = q.length < 6000;
    var opts = useGet ? undefined : {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data='+encodeURIComponent(q)
    };
    var url = useGet ? (base + '?data=' + encodeURIComponent(q)) : base;
    var why = '';
    var host = base.split('/')[2];
    fetch(url, opts)
    .then(function(r){
      if(r.status===429 || r.status===503 || r.status===504){ why='saturé'; throw new Error('q'); }
      if(!r.ok){ why='erreur '+r.status; throw new Error('h'); }
      return r.json();
    })
    .then(function(j){
      if(j && j.remark && /error|timed out|exceeded/i.test(j.remark)){ why='requête trop lourde'; throw new Error('r'); }
      onDone(j);
    })
    .catch(function(){
      if(!why){ why = 'injoignable'; }
      lastWhy = why;
      idx++;
      if(idx < OVERPASS.length){
        if(onNote){ onNote(host+' '+why+' \u2014 essai sur un autre serveur\u2026'); }
        setTimeout(go, 400);                     /* miroir suivant, tout de suite */
        return;
      }
      idx = 0; round++;
      if(round >= 3){
        if(onNote){ onNote('Les '+OVERPASS.length+' serveurs OpenStreetMap sont indisponibles ('+lastWhy+'). Touche « Réessayer » plus tard, de préférence en wifi.'); }
        onDone(null);
        return;
      }
      var wait = round===1 ? 8000 : 25000;
      if(onNote){ onNote('Tous les serveurs occupés \u2014 nouvelle salve dans '+Math.round(wait/1000)+' s (tour '+(round+1)+'/3)\u2026'); }
      setTimeout(go, wait);
    });
  }
  go();
}

/* Interroge un corridor découpé en tronçons, à la file. cb(elements|null, nbEchecs) */
function corridorQuery(line, nChunks, build, onNote, cb){
  var parts = chunkLine(line, nChunks);
  var all = [], failed = 0;
  (function next(k){
    if(k >= parts.length){ cb((failed===parts.length) ? null : all, failed); return; }
    if(onNote){ onNote('Interrogation d\u2019OpenStreetMap \u2014 tronçon '+(k+1)+'/'+parts.length
      +(all.length?(' \u00b7 '+all.length+' trouvés'):'')+'\u2026'); }
    overpassQueue(build(coordList(parts[k])), function(j){
      if(!j){ failed++; }
      else { (j.elements||[]).forEach(function(e){ all.push(e); }); }
      next(k+1);
    }, onNote);
  })(0);
}

/* Polyligne complète du parcours, sous-échantillonnée */
function fullRouteLine(rides, stepM){
  var line = [];
  rides.forEach(function(st){
    var co = ROUTED[st.id];
    var seg = (co && co.length>1) ? co.map(function(c){ return [c[0],c[1]]; })
                                  : densify(st.pts.map(function(p){ return p.ll; }), 300);
    seg.forEach(function(p){ line.push(p); });
  });
  if(!line.length) return line;
  var out = [line[0]], acc = 0;
  for(var i=1;i<line.length;i++){
    acc += distM(line[i-1], line[i]);
    if(acc >= stepM){ out.push(line[i]); acc = 0; }
  }
  var last = line[line.length-1];
  if(out[out.length-1] !== last) out.push(last);
  return out;
}
function chunkLine(line, n){
  var out = [], per = Math.ceil(line.length/n);
  for(var i=0;i<line.length;i+=per){
    var seg = line.slice(i, Math.min(line.length, i+per+1));   /* +1 : recouvrement */
    if(seg.length>1) out.push(seg);
  }
  return out.length ? out : [line];
}
function routeBlocks(rides, n){
  var per = Math.ceil(rides.length/n), out = [];
  for(var i=0;i<rides.length;i+=per){ out.push(rides.slice(i, i+per)); }
  return out;
}
function blockLine(block){
  var line = [];
  block.forEach(function(st){
    var co = ROUTED[st.id];
    var seg = (co && co.length>1) ? co.map(function(c){ return [c[0],c[1]]; })
                                  : densify(st.pts.map(function(p){ return p.ll; }), 300);
    seg.forEach(function(p){ line.push(p); });
  });
  return line;
}
function coordList(line){
  return line.map(function(p){ return p[0].toFixed(4)+','+p[1].toFixed(4); }).join(',');
}

/* Charge toutes les routes d'abord (séquentiel, mis en cache), puis rappelle cb */
function ensureAllRoutes(rides, onProgress, cb){
  var i = 0;
  (function next(){
    if(i >= rides.length){ cb(); return; }
    var st = rides[i];
    if(ROUTED[st.id] && ROUTED[st.id].length>1){ i++; next(); return; }
    if(onProgress){ onProgress('Calcul des tracés \u2014 étape '+(i+1)+'/'+rides.length+'\u2026'); }
    getRoute(st, function(co, src){
      if(co){ ROUTED[st.id] = co; }
      i++;
      setTimeout(next, src==='cache' ? 0 : 120);
    });
  })();
}

/* =========================================================
   POINTS D'EAU POTABLE — données OpenStreetMap en direct
   Interrogés par étape, filtrés à 2 km maximum du tracé,
   puis mis en cache pour rester disponibles hors ligne.
   ========================================================= */
var WATER_MAX_M = 2000;          /* détour maximal accepté */
var WSTYLE = {
  tap:  {ico:'\ud83d\udeb0', col:'#2a7fd4', lab:'Eau potable (OSM)'},
  point:{ico:'\ud83d\udca6', col:'#4aa3e0', lab:'Point d\u2019eau / aire de service'},
  cim:  {ico:'\u271d\ufe0f',  col:'#9fc48f', lab:'Cimetière \u2014 robinet quasi systématique'}
};
function waterKey(st){ return 'bourgwater-'+GEN+'-'+st.id+'-'+Math.round(st.km); }

function routeLine(st){
  var co = ROUTED[st.id];
  if(co && co.length>1){ return co.map(function(c){ return [c[0],c[1]]; }); }
  /* Repli : les villages-étapes seuls ne suffisent pas — on interpole tous les
     300 m, sinon la distance au « tracé » n'a aucun sens entre deux villages. */
  return densify(st.pts.map(function(p){ return p.ll; }), 300);
}
function densify(line, stepM){
  if(line.length < 2) return line;
  var out = [line[0]];
  for(var i=1;i<line.length;i++){
    var a = line[i-1], b = line[i];
    var n = Math.max(1, Math.ceil(distM(a,b)/stepM));
    for(var k=1;k<=n;k++){
      out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
    }
  }
  return out;
}
/* Garantit que le tracé routé est disponible avant d'interroger les POI :
   sans lui, le corridor est faux et le résultat serait mis en cache tel quel. */
function withRoute(st, cb){
  if(ROUTED[st.id] && ROUTED[st.id].length>1){ cb(true); return; }
  getRoute(st, function(co){
    if(co){ ROUTED[st.id] = co; }
    cb(!!co);
  });
}
/* distance minimale d'un point au tracé, en mètres */
function distToLine(pt, line){
  /* on parcourt TOUS les points : un pas trop grand faisait manquer des
     portions entières de tracé et rejetait des points d'eau bien placés. */
  var best = Infinity;
  for(var i=0;i<line.length;i++){
    var d = distM(pt, line[i]);
    if(d < best){ best = d; if(best < 40) return best; }
  }
  return best;
}
function bboxOf(line, pad){
  var la=[], lo=[];
  line.forEach(function(p){ la.push(p[0]); lo.push(p[1]); });
  return [Math.min.apply(null,la)-pad, Math.min.apply(null,lo)-pad,
          Math.max.apply(null,la)+pad, Math.max.apply(null,lo)+pad];
}
/* Récupère les points d'eau d'une étape. cb(list|null, source) */
function getWater(st, cb){
  var key = waterKey(st);
  try{
    var c = localStorage.getItem(key);
    if(c){ cb(JSON.parse(c), 'cache'); return; }
  }catch(e){}
  withRoute(st, function(routed){ getWaterInner(st, key, routed, cb); });
}
function getWaterInner(st, key, routed, cb){
  var line = routeLine(st);
  var bb = bboxOf(line, 0.04);
  var q = '[out:json][timeout:50];('
    + 'node["amenity"="drinking_water"]('+bb.join(',')+');'
    + 'node["man_made"="water_tap"]["drinking_water"!="no"]('+bb.join(',')+');'
    + 'node["amenity"="water_point"]('+bb.join(',')+');'
    + 'nwr["landuse"="cemetery"]('+bb.join(',')+');'
    + ');out center 800;';
  fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q))
   .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
   .then(function(j){
     var out = [];
     (j.elements||[]).forEach(function(e){
       var la = e.lat!=null ? e.lat : (e.center && e.center.lat);
       var lo = e.lon!=null ? e.lon : (e.center && e.center.lon);
       if(la==null || lo==null) return;
       var t = e.tags||{};
       var kind = t.amenity==='drinking_water' || t.man_made==='water_tap' ? 'tap'
                : (t.amenity==='water_point' ? 'point'
                : (t.landuse==='cemetery' ? 'cim' : null));
       if(!kind) return;
       var d = distToLine([la,lo], line);
       if(d > WATER_MAX_M) return;                       /* détour > 2 km : écarté */
       out.push([+la.toFixed(5), +lo.toFixed(5), kind, Math.round(d),
                 (t.name||'').replace(/[<>&"]/g,' ').slice(0,40)]);
     });
     out.sort(function(a,b){ return a[3]-b[3]; });
     out = out.slice(0,150);
     if(routed){ try{ localStorage.setItem(key, JSON.stringify(out)); }catch(e){} }
     cb(out, 'live');
   })
   .catch(function(){ cb(null,'fail'); });
}



/* ---------------------------------------------------------
   VÉLOCISTES & DECATHLON (OpenStreetMap)
   shop=bicycle · enseignes Decathlon (shop=sports / brand)
   Rayon élargi à 5 km : pour une réparation, le détour vaut
   le coup bien au-delà des 2 km des points d'eau.
   --------------------------------------------------------- */
var VELO_MAX_M = 5000;
var VSTYLE = {
  bike: {ico:'\ud83d\udd27', col:'#e07b39', lab:'Vélociste'},
  deca: {ico:'\ud83c\udfea', col:'#1d5fa8', lab:'Decathlon'}
};
function veloKey(st){ return 'bourgvelo-'+GEN+'-'+st.id+'-'+Math.round(st.km); }
function getVelo(st, cb){
  var key = veloKey(st);
  try{
    var c = localStorage.getItem(key);
    if(c){ cb(JSON.parse(c), 'cache'); return; }
  }catch(e){}
  withRoute(st, function(routed){ getVeloInner(st, key, routed, cb); });
}
function getVeloInner(st, key, routed, cb){
  var line = routeLine(st);
  var bb = bboxOf(line, 0.07);
  var B = bb.join(',');
  var q = '[out:json][timeout:50];('
    + 'nwr["shop"="bicycle"]('+B+');'
    + 'nwr["brand"~"Decathlon",i]('+B+');'
    + 'nwr["name"~"Decathlon",i]('+B+');'
    + ');out center 300;';
  fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q))
   .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
   .then(function(j){
     var out = [], seen = {};
     (j.elements||[]).forEach(function(e){
       var la = e.lat!=null ? e.lat : (e.center && e.center.lat);
       var lo = e.lon!=null ? e.lon : (e.center && e.center.lon);
       if(la==null || lo==null) return;
       var t = e.tags||{};
       var nm = (t.name||'').trim();
       var isDeca = /decathlon/i.test(nm) || /decathlon/i.test(t.brand||'');
       if(!isDeca && t.shop!=='bicycle') return;
       var id = la.toFixed(4)+','+lo.toFixed(4);
       if(seen[id]) return;
       seen[id] = 1;
       var d = distToLine([la,lo], line);
       if(d > VELO_MAX_M) return;
       out.push([+la.toFixed(5), +lo.toFixed(5), isDeca?'deca':'bike', Math.round(d),
                 nm.replace(/[<>&"]/g,' ').slice(0,40),
                 (t.phone||t['contact:phone']||'').replace(/[<>&"]/g,' ').slice(0,20)]);
     });
     out.sort(function(a,b){ return a[3]-b[3]; });
     out = out.slice(0,80);
     if(routed){ try{ localStorage.setItem(key, JSON.stringify(out)); }catch(e){} }
     cb(out, 'live');
   })
   .catch(function(){ cb(null,'fail'); });
}

/* ---------- mode guidon ---------- */
var GUIDON = {active:false, id:null, wl:null};
function enterGuidon(sid){
  var st = RUN.stages.find(function(s){ return s.id===sid; });
  var box = document.getElementById('map-'+sid), m = maps[sid];
  if(!st || !box || !m) return;
  GUIDON.active = true; GUIDON.id = sid;
  box.classList.add('guidon-fs');
  document.body.classList.add('noscroll');
  if(box.requestFullscreen){ box.requestFullscreen().catch(function(){}); }
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(function(w){ GUIDON.wl=w; }).catch(function(){});
  }
  m._follow = true;
  if(!m._locating){ m._locating=true; m.locate({watch:true, enableHighAccuracy:true}); }
  var bar = document.createElement('div');
  bar.className = 'guidon-bar';
  bar.innerHTML = '<span class="gstep">J'+st.day+' · '+esc(st.from.n)+' \u2192 '+esc(st.to.n)+' · '+kmLabel(st)+'</span>'
    +'<button class="gexit" aria-label="Quitter le mode guidon">\u2715</button>';
  box.appendChild(bar);
  bar.querySelector('.gexit').addEventListener('click', exitGuidon);
  setTimeout(function(){ m.invalidateSize(); },250);
}
function exitGuidon(){
  if(!GUIDON.active) return;
  var box = document.getElementById('map-'+GUIDON.id), m = maps[GUIDON.id];
  if(box){
    box.classList.remove('guidon-fs');
    var b = box.querySelector('.guidon-bar'); if(b) b.remove();
  }
  document.body.classList.remove('noscroll');
  if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
  if(m){ m._follow=false; setTimeout(function(){ m.invalidateSize(); },250); }
  if(GUIDON.wl){ try{ GUIDON.wl.release(); }catch(e){} GUIDON.wl=null; }
  GUIDON.active=false; GUIDON.id=null;
}
document.addEventListener('fullscreenchange', function(){
  if(GUIDON.active && !document.fullscreenElement){ exitGuidon(); }
});
